; E-ink DAP firmware. Each [env:*] is one app built from src/<name>/:
; self-tests that run on the bare board, bring-up tests for each part,
; and the player itself. Shared code lives in lib/, pins in include/pins.h.

[platformio]
default_envs = selftest
; ".nosync" keeps the build output out of iCloud Drive sync.
workspace_dir = .pio.nosync
; Flash filesystem contents (decoder benchmark clips, made by tools/make_bench_clips.sh).
data_dir = bench_audio.nosync

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; On the native USB port an RTS reset after upload drops back into download mode.
board_upload.after_reset = watchdog-reset
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes over the native USB port ("USB"), not the UART bridge.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:selftest]
build_src_filter = +<selftest/>

[env:i2s_clocks]
build_src_filter = +<i2s_clocks/>

[env:decode_bench]
build_src_filter = +<decode_bench/>
board_build.partitions = partitions/bench_16MB.csv
board_build.filesystem = littlefs
lib_deps = https://github.com/mackron/dr_libs.git#dfe8377631000664666519fdb83da193fd8037f4

[env:reader_bench]
build_src_filter = +<reader_bench/>
; Made by tools/make_reader_bench.sh: a converted 450 KB novel and an 18 px font.
board_build.embed_files =
    bench_reader.nosync/book.dbk
    bench_reader.nosync/font.dfn

[env:player]
build_src_filter = +<player/>

; ---- Bring-up tests, one per part (PROJECT.md §6). Wire the part, then upload. ----

[env:bringup_epd]
build_src_filter = +<bringup_epd/>
lib_deps = zinggjm/GxEPD2@1.6.9

[env:bringup_sd]
build_src_filter = +<bringup_sd/>

[env:bringup_dac]
build_src_filter = +<bringup_dac/>
lib_deps = https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0
; The library expects the log level the Arduino IDE board menu normally sets (1 = errors).
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1

[env:bringup_buttons]
build_src_filter = +<bringup_buttons/>

[env:bringup_touch]
build_src_filter = +<bringup_touch/>

; ---- UI demo: home screen, Reader and Settings with only the screen and touch wired ----

[env:ui_demo]
build_src_filter = +<ui_demo/>
lib_deps = zinggjm/GxEPD2@1.6.9
; Made by tools/make_ui_demo.py: the books and fonts, packed.
board_build.embed_files = ui_demo.nosync/card.pack

; The same screens drawn on the Mac as PNGs: pio run -e ui_sim, then run
; .pio.nosync/build/ui_sim/program (src/ui_sim/main.cpp).
[env:ui_sim]
platform = native
framework =
board = host
build_src_filter = +<ui_sim/>
build_flags = -std=c++17 -Wall -Wextra

; ---- Host-side unit tests for the plain C++ parts of lib/ (no board needed) ----
; pio test -e native   (needs a C++ compiler: on macOS, the Xcode command line tools)

[env:native]
platform = native
framework =
; [env] above sets an ESP32 board for every env; boards/host.json is a stand-in so the
; ESP32 board_* options have something to apply to.
board = host
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
test_framework = unity
